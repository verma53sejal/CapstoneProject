services:
  - type: web
    name: placementpro-backend
    runtime: docker
    rootDir: backend-springboot
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 8080

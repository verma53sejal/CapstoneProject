spring.application.name=placement-tracker-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=2592000000

# Code execution is disabled until a sandboxed executor is configured.
app.code-execution.enabled=${CODE_EXECUTION_ENABLED:false}
judge0.api-url=${JUDGE0_API_URL:}
judge0.api-key=${JUDGE0_API_KEY:}
judge0.api-host=${JUDGE0_API_HOST:}
judge0.poll-interval-ms=${JUDGE0_POLL_INTERVAL_MS:750}
judge0.max-poll-attempts=${JUDGE0_MAX_POLL_ATTEMPTS:20}
judge0.cpu-time-limit=${JUDGE0_CPU_TIME_LIMIT:2}
judge0.wall-time-limit=${JUDGE0_WALL_TIME_LIMIT:5}
judge0.memory-limit=${JUDGE0_MEMORY_LIMIT:128000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.com.placementpro=DEBUG
logging.level.org.springframework.security=WARN

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

